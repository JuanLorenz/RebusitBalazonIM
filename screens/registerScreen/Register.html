<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildSTAR Registration</title>

    <link rel="stylesheet" href="RegisterDesign.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body style="background: url('../../images/backgroundGlobal.png') no-repeat center center/cover;">

<div class="overlay">

    <!-- BACK BUTTON -->
    <img src="../../images/back.png" class="back-btn" onclick="history.back()">

    <div class="container">

        <!-- Logo -->
        <img src="../../images/wildStarLogo.png" class="logo">

        <!-- Title -->
        <h1>Registration</h1>
        <h2>Enter User Details</h2>

        <!-- Form -->
        <div style="display: flex; flex-direction: row; gap: 20px;">

            <div>
                <form>
                    <div class="input-group">
                        <input type="text" id="firstName" placeholder="First Name" required>
                    </div>
                    
                    <div class="input-group">
                        <input type="text" id="lastName" placeholder="Last Name" required>
                    </div>

                    <div class="input-group">
                        <input type="text" id="regUserID" placeholder="ID Number" required>
                    </div>
                    
                    <div class="input-group">
                        <input type="text" id="regDeptID" placeholder="Department" required>
                    </div>

                </form>
            </div>

            <div>
                <form>
                    <div class="input-group">
                        <input type="text" id="regEmail" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="regPassword" placeholder="Password" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="rePassword" placeholder="Re-enter Password" required>
                    </div>
                </form>
            </div>

        </div>
            <button type="button" class="register-btn" onClick="goRegister()">Register</button>
    </div>
</div>

<script>
function goRegister() {
    // 1. Get Values
    const fName = document.getElementById('firstName').value;
    const lName = document.getElementById('lastName').value;
    const uID = document.getElementById('regUserID').value;
    const pass = document.getElementById('regPassword').value;
    const rePass = document.getElementById('rePassword').value;
    const dept = document.getElementById('regDeptID').value;
    const email = document.getElementById('regEmail').value;

    // 2. Basic Validation
    if (!fName || !lName || !uID || !pass || !dept || !email) {
        alert("Please fill in all required fields.");
        return;
    }

    if (pass !== rePass) {
        alert("Passwords do not match!");
        return;
    }

    // 3. Prepare Data
    const formData = new FormData();
    formData.append('firstName', fName);
    formData.append('lastName', lName);
    formData.append('userID', uID);
    formData.append('password', pass);
    formData.append('deptID', dept);
    formData.append('email', email);

    // 4. Send to PHP
    fetch('../../php/register_user.php', {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Registration Successful!");
            window.location.href = "../loginScreen/Login.html";
        } else {
            alert("Error: " + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert("An error occurred. Check console.");
    });
}
</script>

</body>
</html>
