<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildSTAR Registration</title>

    <link rel="stylesheet" href="RegisterDesign.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>

<body style="background: url('../../images/backgroundGlobal.png') no-repeat center center/cover;">

<div class="overlay">

    <!-- BACK BUTTON -->
    <img src="../../images/back.png" class="back-btn" onclick="history.back()">

    <div class="container">

        <!-- Logo -->
        <img src="../../images/wildStarLogo.png" class="logo">

        <!-- Title -->
        <h1>Registration</h1>
        <h2>Enter User Details</h2>

        <!-- Form -->
        <div style="display: flex; flex-direction: row; gap: 20px;">

                <div>
                    <form>
                        <div class="input-group">
                            <input type="text" placeholder="Fullname" required>
                        </div>

                        <div class="input-group">
                            <input type="text" placeholder="ID Number" required>
                        </div>

                        <div class="input-group">
                            <input type="password" placeholder="Password" required>
                        </div>

                        <div class="input-group">
                            <input type="password" placeholder="Re-enter Password" required>
                        </div>
                    </form>
                </div>

                <div>
                    <form>
                    <div class="input-group">
                        <input type="text" placeholder="Department" required>
                    </div>

                    <div class="input-group">
                        <input type="text" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <input type="text" placeholder="Contact No." required>
                    </div>
                    </form>
                </div>
        </div>
            <button type="submit" class="register-btn">Register</button>
    </div>
</div>

</body>
</html>
