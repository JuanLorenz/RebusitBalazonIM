<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        /* ── RESET & BASE (Matching User Dashboard) ──────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Archivo Black", sans-serif;
        }

        body {
            height: 100vh;
            overflow-y: auto;
            background: linear-gradient(rgba(145,49,49,0.55), rgba(145,49,49,0.55)),
                        url('../../images/backgroundGlobal.png');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
        }

        .overlay {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            position: relative;
        }

        /* ── NAVIGATION & LOGOS ──────────────────────────────────── */
        .logo {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 150px;
            z-index: 1000;
        }

        .exit-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            width: 75px;
            cursor: pointer;
            transition: 0.2s ease;
            z-index: 1000;
        }

        .exit-btn:hover { transform: scale(1.08); }

        .nav-tab {
            margin-top: -55px;
            width: 1150px;
            max-width: 95%;
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .nav-header-text {
            color: white;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── MAIN CARD ───────────────────────────────────────────── */
        .dashboard-card {
            width: 1150px;
            max-width: 95%;
            min-height: 650px;
            background: rgba(120, 0, 0, 0.88);
            border-radius: 22px;
            padding: 45px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* ── SELECTION BAR ───────────────────────────────────────── */
        .selection-bar {
            width: 100%;
            height: 55px;
            background: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-size: 14px;
            color: #555;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }
        .selection-bar.active { color: #7a0000; font-weight: bold; }

        /* ── TABLE STYLING (Matching User Sub-area Table) ────────── */
        .list-container {
            width: 100%;
            height: 350px;
            background: white;
            border-radius: 20px;
            overflow-y: auto;
            border: 2px solid #000;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            color: black;
            background: white;
        }

        .admin-table th {
            background: #ffb300;
            color: #7a0000;
            padding: 15px;
            font-size: 14px;
            border: 1px solid black;
            position: sticky;
            top: 0;
            z-index: 2;
            text-transform: uppercase;
        }

        .admin-table td {
            padding: 12px 15px;
            border: 1px solid black;
            cursor: pointer;
            transition: 0.2s ease;
            font-size: 13px;
        }

        .admin-table tr:hover td { background: #dcdcdc; }
        .admin-table tr.selected td { background: #ffa600 !important; color: #7a0000; }

        /* ── STATUS BADGES ───────────────────────────────────────── */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            border: 1px solid #000;
            display: inline-block;
        }
        .badge.pending { background: #fff3cc; color: #7a5500; }
        .badge.confirmed { background: #dceeff; color: #1a4a8b; }
        .badge.cancelled { background: #fde8e8; color: #8b1a1a; }

        /* ── BUTTONS ─────────────────────────────────────────────── */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            height: 55px;
            border: none;
            border-radius: 14px;
            background: #ffb300;
            color: #7a0000;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }

        .action-btn:hover { background: #ffd000; transform: scale(1.03); }
        .action-btn:active { transform: scale(0.98); }

        /* ── PAGINATION ──────────────────────────────────────────── */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .page-btn {
            background: #ffb300;
            color: #7a0000;
            border: none;
            border-radius: 10px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 12px;
        }
        .page-btn.active { background: white; color: #7a0000; border: 2px solid #ffb300; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .action-status {
            text-align: center;
            color: white;
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
        }

        /* Custom Scrollbar for the table container */
        .list-container::-webkit-scrollbar { width: 8px; }
        .list-container::-webkit-scrollbar-thumb { background: #7a0000; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="overlay">
        <!-- Matching User Dashboard Assets -->
        <img src="../../images/wildStarLogo.png" class="logo">
        <img src="../../images/iconLogout.png" class="exit-btn" onclick="goLogin()">

        <div style="display: flex; flex-direction: column; width: 1150px; max-width: 95%;">
            
            <div class="nav-tab">
                <span class="nav-header-text">Admin / Manage Reservations</span>
            </div>

            <div class="dashboard-card">
                
                <!-- Selection Info Bar -->
                <div class="selection-bar" id="selectionBar">
                    <span id="selectionText">Click a reservation to select...</span>
                </div>

                <!-- Reservation List (Table) -->
                <div class="list-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Res. ID</th>
                                <th>User ID</th>
                                <th>Resource</th>
                                <th>Start Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="reservationList">
                            <!-- Rows loaded via JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="pagination" id="pagination"></div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button class="action-btn" onclick="confirmReservation()">Confirm Reservation</button>
                    <button class="action-btn" onclick="blockUser()" style="background: #e74c3c; color: white;">Block User</button>
                    <button class="action-btn" onclick="unblockUser()">Unblock User</button>
                </div>

                <div id="actionStatus" class="action-status"></div>

            </div>
        </div>
    </div>

    <script>
        let selectedReservation = null;
        let currentPage = 1;

        function showStatus(message, isError = false) {
            const status = document.getElementById("actionStatus");
            status.textContent = message;
            status.style.color = isError ? "#ffb3b3" : "#ffd000";
            setTimeout(() => { status.textContent = ""; }, 3000);
        }

        function goLogin() { window.location.href = "../loginScreen/Login.html"; }

        async function loadReservations(page = 1) {
            currentPage = page;
            const tbody = document.getElementById("reservationList");
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>';

            try {
                const res = await fetch(`../../php/get_reservations.php?page=${page}`);
                const data = await res.json();

                if (!data.success) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color:red;">Error: ${data.message}</td></tr>`;
                    return;
                }

                renderList(data.reservations);
                renderPagination(data.currentPage, data.totalPages);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5">Network error. Check console.</td></tr>`;
            }
        }

        function renderList(reservations) {
            const tbody = document.getElementById("reservationList");
            tbody.innerHTML = '';

            if (!reservations.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>';
                return;
            }

            reservations.forEach(r => {
                const row = document.createElement("tr");
                const rawStatus = (r.status_type || 'pending').trim().toLowerCase();
                
                const startDate = r.startTime ? new Date(r.startTime) : null;
                const dateStr = startDate ? startDate.toLocaleString('en-PH') : '—';

                row.innerHTML = `
                    <td>#${r.reservationID}</td>
                    <td>${r.userID}</td>
                    <td>${r.resourceName || r.resourceID}</td>
                    <td>${dateStr}</td>
                    <td><span class="badge ${rawStatus}">${rawStatus}</span></td>
                `;

                row.onclick = () => selectRow(row, r);
                tbody.appendChild(row);
            });
        }

        function selectRow(rowEl, reservation) {
            document.querySelectorAll("#reservationList tr").forEach(tr => tr.classList.remove("selected"));
            rowEl.classList.add("selected");
            selectedReservation = reservation;

            const bar = document.getElementById("selectionBar");
            const text = document.getElementById("selectionText");
            bar.classList.add("active");
            text.textContent = `SELECTED: Res #${reservation.reservationID} (User: ${reservation.userID})`;
        }

        function renderPagination(current, total) {
            const pag = document.getElementById("pagination");
            pag.innerHTML = '';
            if (total <= 1) return;

            for (let i = 1; i <= total; i++) {
                const btn = document.createElement("button");
                btn.textContent = i;
                btn.className = "page-btn" + (i === current ? " active" : "");
                btn.onclick = () => loadReservations(i);
                pag.appendChild(btn);
            }
        }

        // --- Logic Handlers ---
        async function handleAction(url, body) {
            if (!selectedReservation) {
                showStatus("Please select a reservation first!", true);
                return;
            }
            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });
                const result = await res.json();
                showStatus(result.message);
                if (result.success) loadReservations(currentPage);
            } catch (err) { showStatus("Request failed.", true); }
        }

        window.confirmReservation = () => handleAction("../../php/confirm_reservation.php", { reservationID: selectedReservation.reservationID });
        window.blockUser = () => handleAction("../../php/block_user.php", { userID: selectedReservation.userID });
        window.unblockUser = () => handleAction("../../php/unblock_user.php", { userID: selectedReservation.userID });

        loadReservations(1);
    </script>
</body>
</html>
