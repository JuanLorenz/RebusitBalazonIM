<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wildcat Reservations</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Archivo Black', sans-serif; }

        body {
            margin: 0;
            background: linear-gradient(rgba(145, 49, 49, 0.55), rgba(145, 49, 49, 0.55)), url('../../images/backgroundGlobal.png');
            background-size: cover;
        }

        /* ── Overlay: mirrors reservationScreen ── */
        .overlay {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;;
            padding: 40px 20px;
            position: relative;
        }

        /* Logo & logout pinned to corners, same as reservation screen */
        .logo {
            width: 150px;
            position: absolute;
            top: 20px;
            left: 30px;
        }

        .exit-btn {
            width: 75px;
            position: absolute;
            top: 20px;
            right: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .exit-btn:hover { transform: scale(1.05); }

        /* ── Center column ── */
        .center-column {
            display: flex;
            flex-direction: column;
            position: relative;
            width: 1000px;
            max-width: 95%;
        }

        .nav-tab { display: flex; gap: 10px; margin-bottom: 10px; }
        .nav-buttons {
            color: #7a0000;
            background-color: #ffb300;
            border-radius: 20px;
            width: 180px;
            padding: 10px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-buttons:hover { background: #ffd000; transform: scale(1.03); }

        /* ── Dashboard card ── */
        .dashboard-card {
            width: 100%;
            background: rgba(145, 49, 49, 0.9);
            border-radius: 22px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 600px;
        }

        .search-bar { width: 100%; height: 45px; padding: 0 15px; border-radius: 20px; border: none; margin-bottom: 20px; }
        .section-label { color: white; margin-bottom: 10px; display: block; }

        .active-res-box { background: white; padding: 20px; border-radius: 15px; border-left: 15px solid #ffb300; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .history-container { height: 250px; overflow-y: auto; background: white; border-radius: 15px; margin-bottom: 20px; }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table td { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }

        .modal-overlay { position: fixed; top:0; left:0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-card { width: 600px; background: white; padding: 30px; border-radius: 20px; }

        .action-status { text-align: center; color: #ffd000; font-size: 14px; margin-top: 10px; height: 20px; }
    </style>
</head>

<body>
    <div class="overlay">

        <!-- Logo & Logout — absolutely pinned to corners, same as reservation screen -->
        <img src="../../images/wildStarLogo.png" class="logo">
        <img src="../../images/iconLogout.png" class="exit-btn" onclick="location.href='../loginScreen/Login.html'">

        <!-- Center column: nav tabs + card -->
        <div class="center-column">

            <div class="nav-tab">
                <button class="nav-buttons" style="background:white; color:#7a0000;">Dashboard</button>
                <button class="nav-buttons" onclick="goToReservation()">Reserve</button>
            </div>

            <div class="dashboard-card">
                <input type="text" class="search-bar" id="historySearch" placeholder="Search history..." onkeyup="filterHistory()">

                <label class="section-label">Ongoing Reservation</label>
                <div id="activeResContainer"></div>

                <label class="section-label">Reservation History</label>
                <div class="history-container">
                    <table class="history-table"><tbody id="historyBody"></tbody></table>
                </div>

                <div id="paginationContainer" class="pagination"></div>
                <div id="eligibilityError" style="color: #ffcfcf; text-align: center; font-weight: bold;"></div>
            </div>

        </div>

        <div id="actionStatus" class="action-status"></div>

    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 style="color: #7a0000;">RESERVATION DETAILS</h2>
            <div id="modalContent"></div>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let canReserve = true;
        let isBlocked = false;
        let blockedUntil = null;

        function showStatus(message, isError = false) {
            const status = document.getElementById("actionStatus");
            status.textContent = message;
            status.style.color = isError ? "#ffb3b3" : "#ffd000";
            setTimeout(() => { status.textContent = ""; }, 3000);
        }

        function formatDateTime(date) { return new Date(date).toLocaleString(); }
        function formatShortDate(date) { return new Date(date).toLocaleDateString(); }
        function formatShortDateTime(date) {
            return new Date(date).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function fetchDashboardData(page = 1) {
            try {
                const response = await fetch(`../../php/get_user_dashboard.php?page=${page}`);
                const data = await response.json();
                if (!data.success) return;

                isBlocked = data.isBlocked;
                blockedUntil = data.blockedUntil;

                const activeContainer = document.getElementById('activeResContainer');

                if (data.activeReservation) {
                    canReserve = false;
                    const r = data.activeReservation;
                    activeContainer.innerHTML = `
                        <div class="active-res-box" onclick='showDetails(${JSON.stringify(r)})'>
                            <div>
                                <h2 style="color:#7a0000; font-size:24px;">${r.resourceName}</h2>
                                <p style="color:#666; font-size:14px;">${r.areaName}</p>
                            </div>
                            <div style="text-align:right">
                                <p style="font-size:16px; margin-bottom:5px;"><b>${formatShortDateTime(r.startTime)}</b></p>
                                <span style="background:#fff3cc; color:#7a5500; font-size:11px; padding:6px 12px;">${r.status_type}</span>
                            </div>
                        </div>`;
                } else {
                    canReserve = true;
                    activeContainer.innerHTML = `<div class="active-res-box">No pending or active reservations.</div>`;
                }

                document.getElementById('historyBody').innerHTML = data.history.map(r => `
                    <tr onclick='showDetails(${JSON.stringify(r)})'>
                        <td><b>${r.resourceName}</b><br><small>${r.areaName}</small></td>
                        <td style="text-align:right">${formatShortDate(r.startTime)}<br>${r.status_type}</td>
                    </tr>`).join('');

                renderPagination(data.currentPage, data.totalPages);
                document.getElementById('eligibilityError').textContent = "";
            } catch (error) { console.error(error); }
        }

        function goToReservation() {
            const errorDiv = document.getElementById('eligibilityError');
            if (isBlocked) {
                errorDiv.textContent = "Unable to reserve. Your account is blocked until " + formatDateTime(blockedUntil);
                setTimeout(() => { errorDiv.textContent = ""; }, 1500);
                return;
            }
            if (!canReserve) {
                errorDiv.textContent = "Unable to reserve. You have an ongoing reservation.";
                setTimeout(() => { errorDiv.textContent = ""; }, 1500);
                return;
            }
            window.location.href = "../reservationScreen/reservationScreen.html";
        }

        function renderPagination(current, total) {
            const container = document.getElementById('paginationContainer');
            container.innerHTML = '';
            if (total <= 1) return;
            for (let i = 1; i <= total; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `page-btn ${i === current ? 'active' : ''}`;
                btn.onclick = () => fetchDashboardData(i);
                container.appendChild(btn);
            }
        }

        function showDetails(r) {
            document.getElementById('modalContent').innerHTML = `
                <div><b>Reservation ID</b><p>#${r.reservationID}</p></div>
                <div><b>Status</b><p>${r.status_type}</p></div>
                <div><b>Resource Name</b><p>${r.resourceName}</p></div>
                <div><b>Study Area</b><p>${r.areaName}</p></div>
                <div><b>Starts At</b><p>${formatDateTime(r.startTime)}</p></div>
                <div><b>Ends At</b><p>${formatDateTime(r.endTime)}</p></div>
                <div><b>Purpose</b><p>${r.purpose || 'No purpose provided.'}</p></div>
                <div><b>Participants</b><p>${r.num_participants} person(s)</p></div>`;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function filterHistory() {
            const value = document.getElementById('historySearch').value.toLowerCase();
            document.querySelectorAll('#historyBody tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(value) ? '' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', () => fetchDashboardData(1));
    </script>
</body>
</html>
