    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - Wildcat Reservations</title>
        <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
        <style>
            /* ======================================================
            GLOBAL / PAGE
            ======================================================= */
            * { box-sizing: border-box; font-family: 'Archivo Black', sans-serif; }

            body {
                margin: 0;
                height: 100vh;
                background: linear-gradient(rgba(145, 49, 49, 0.55), rgba(145, 49, 49, 0.55)), 
                            url('../../images/backgroundGlobal.png');
                background-size: cover;
                background-position: center;
                overflow: hidden; /* Prevents double scrollbars on the body */
            }

            .overlay {
                width: 100%;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center; /* Centered vertically like your target look */
                padding: 20px;
                position: relative;
            }

            /* Logo & Logout pinned to corners */
            /* LOGO */
            .logo{
                position: fixed;
                top: 10px;
                left: 10px;
                width: 150px;
                z-index: 1000;
            }

            /* EXIT BUTTON */
            .exit-btn{
                position: fixed;
                top: 12px;
                right: 12px;
                width: 75px;
                cursor: pointer;
                transition: 0.2s ease;
                z-index: 1000;
            }
            .exit-btn:hover { transform: scale(1.05); }

            /* ======================================================
            MAIN DASHBOARD LAYOUT
            ======================================================= */
            .dashboard-wrapper {
                display: flex;
                flex-direction: column;
                width: 1000px;
                max-width: 95%;
                margin-top: 40px;
            }

            .dashboard-card {
                width: 100%;
                background: rgba(117, 3, 3, 0.90); /* Deep maroon, less muted */
                border-radius: 22px;
                min-height: 650px;
                padding: 30px 45px;
                display: flex;
                flex-direction: column;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }

            /* Navigation */
            .nav-tab { display: flex; gap: 10px; margin-bottom: 10px; }
            .nav-buttons {
                color: #7a0000;
                background-color: #ffb300;
                border-radius: 20px;
                width: 180px;
                padding: 10px;
                border: none;
                cursor: pointer;
                font-size: 14px;
                transition: 0.2s;
            }
            .nav-buttons:hover { background: #ffd000; transform: scale(1.03); }

            /* Search */
            .search-container { margin-bottom: 15px; }
            .search-bar { 
                width: 100%; 
                height: 40px; 
                padding: 0 15px; 
                border-radius: 20px; 
                border: none; 
                font-size: 13px;
            }

            .section-label { color: white; margin: 10px 0; display: block; font-size: 16px; }

            /* ======================================================
            ACTIVE RESERVATION
            ======================================================= */
            .active-res-box { 
                background: white; 
                padding: 20px 30px; 
                border-radius: 15px; 
                border-left: 15px solid #ffb300; 
                margin-bottom: 20px; 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                cursor: pointer;
                box-shadow: 0 6px 15px rgba(0,0,0,0.2);
                transition: 0.2s;
            }
            .active-res-box:hover:not(.empty) { transform: translateY(-3px); background: #fffdf8; }

            .active-res-box.empty {
                justify-content: center;
                padding: 40px;
                background: rgba(255, 255, 255, 0.1);
                color: rgba(255, 255, 255, 0.7);
                border: 2px dashed rgba(255, 255, 255, 0.3);
                border-left: none;
                cursor: default;
            }

            /* ======================================================
            HISTORY TABLE & SCROLLBAR
            ======================================================= */
            .history-container { 
                height: 265px; 
                overflow-y: auto; 
                background: white; 
                border-radius: 15px; 
                margin-bottom: 15px;
                border: 1px solid #000;
            }
            .history-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
            .history-table tr { height: 53px; border-bottom: 1px solid #eee; cursor: pointer; }
            .history-table tr:hover { background: #fff8e1; }
            .history-table td { padding: 0 15px; font-size: 13px; color: #333; }

            /* Custom Scrollbar */
            .history-container::-webkit-scrollbar { width: 6px; }
            .history-container::-webkit-scrollbar-thumb { background: #ffb300; border-radius: 10px; }

            /* Status Tags */
            .status-tag {
                padding: 4px 8px;
                font-size: 9px;
                font-weight: bold;
                text-transform: uppercase;
                border-radius: 5px;
                border: 1px solid rgba(0,0,0,0.1);
            }
            .COMPLETED { background: #d4f5e2; color: #1a7a45; }
            .NOSHOW { background: #fde8e8; color: #8b1a1a; }
            .CANCELLED { background: #eee; color: #666; }
            .PENDING, .ACTIVE { background: #fff3cc; color: #7a5500; }

            /* Pagination */
            .pagination { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
            .page-btn { 
                padding: 8px 15px; 
                background: #ffb300; 
                color: #7a0000; 
                border: none; 
                border-radius: 10px; 
                cursor: pointer; 
                font-size: 12px;
            }
            .page-btn.active { background: white; border: 2px solid #ffb300; }

            /* ======================================================
            MODAL
            ======================================================= */
            .modal-overlay { 
                position: fixed; top:0; left:0; width: 100vw; height: 100vh; 
                background: rgba(0,0,0,0.85); display: none; 
                justify-content: center; align-items: center; z-index: 5000; 
            }
            .modal-card { 
                width: 650px; background: white; padding: 35px; border-radius: 22px; 
                box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            }
            .modal-grid { 
                display: grid; grid-template-columns: 1fr 1fr; 
                column-gap: 30px; row-gap: 15px; margin-bottom: 25px; 
            }
            .modal-item b { display: block; color: #7a0000; font-size: 12px; text-transform: uppercase; }
            .modal-item p {
                margin: 2px 0 0; 
                color: #333; 
                font-size: 15px; 
                word-wrap: break-word;       /* Added */
                overflow-wrap: break-word;   /* Added */
                white-space: normal;         /* Added */
            }

            /* Find .purpose-detail-box and add overflow-x: hidden */
            .purpose-detail-box {
                max-height: 100px; 
                overflow-y: auto; 
                overflow-x: hidden;          /* Added to prevent any horizontal shift */
                margin-top: 5px;
                padding-left: 10px; 
                padding-right: 5px;          /* Added a little padding for the scrollbar */
                border-left: 3px solid #ffb300;
            }

            .close-modal-btn {
                width: 100%; height: 50px; background: #ffb300; color: #7a0000;
                border: none; border-radius: 10px; cursor: pointer; font-size: 16px;
                transition: 0.2s;
            }
            .close-modal-btn:hover { background: #ffd000; }
        </style>
    </head>

    <body>
        <div class="overlay">
            <img src="../../images/wildStarLogo.png" class="logo" width="150px">
            <img src="../../images/iconLogout.png" class="exit-btn" width="75px" onclick="location.href='../loginScreen/Login.html'">

            <div class="dashboard-wrapper">
                <div class="nav-tab">
                    <button class="nav-buttons" style="background:white; color:#7a0000;">Dashboard</button>
                    <button class="nav-buttons" onclick="goToReservation()">Reserve</button>
                </div>

                <div class="dashboard-card">
                    <div class="search-container">
                        <input type="text" class="search-bar" id="historySearch" placeholder="Search history..." onkeyup="filterHistory()">
                    </div>

                    <label class="section-label">Ongoing Reservation</label>
                    <div id="activeResContainer"></div>

                    <label class="section-label">Reservation History</label>
                    <div class="history-container">
                        <table class="history-table">
                            <tbody id="historyBody"></tbody>
                        </table>
                    </div>

                    <div id="paginationContainer" class="pagination"></div>
                    <div id="eligibilityError" style="color: #ffcfcf; text-align: center; font-weight: bold; font-size: 13px; min-height: 20px;"></div>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
            <div class="modal-card" onclick="event.stopPropagation()">
                <h2 style="color: #7a0000; margin-bottom: 25px; border-bottom: 2px solid #ffb300; padding-bottom: 10px;">RESERVATION DETAILS</h2>
                <div id="modalContent" class="modal-grid"></div>
                <button class="close-modal-btn" onclick="closeModal()">CLOSE</button>
            </div>
        </div>

        <script>
            let canReserve = true;
            let isBlocked = false;
            let blockedUntil = null;

            function formatDateTime(date) { return new Date(date).toLocaleString(); }
            function formatShortDate(date) { return new Date(date).toLocaleDateString(); }
            function formatShortDateTime(date) {
                return new Date(date).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }

            async function fetchDashboardData(page = 1) {
                try {
                    const response = await fetch(`../../php/get_user_dashboard.php?page=${page}`);
                    const data = await response.json();
                    if (!data.success) return;

                    isBlocked = data.isBlocked;
                    blockedUntil = data.blockedUntil;

                    const activeContainer = document.getElementById('activeResContainer');

                    if (data.activeReservation) {
                        canReserve = false;
                        const r = data.activeReservation;
                        activeContainer.innerHTML = `
                            <div class="active-res-box" onclick='showDetails(${JSON.stringify(r)})'>
                                <div>
                                    <h2 style="color:#7a0000; font-size:24px; margin:0;">${r.resourceName}</h2>
                                    <p style="color:#666; font-size:14px; margin:5px 0 0 0;">${r.areaName}</p>
                                </div>
                                <div style="text-align:right">
                                    <p style="font-size:16px; margin-bottom:5px;"><b>${formatShortDateTime(r.startTime)}</b></p>
                                    <span class="status-tag PENDING" style="padding:6px 12px;">${r.status_type}</span>
                                </div>
                            </div>`;
                        activeContainer.classList.remove('empty');
                    } else {
                        canReserve = true;
                        activeContainer.innerHTML = `<div class="active-res-box empty">No pending or active reservations.</div>`;
                    }

                    document.getElementById('historyBody').innerHTML = data.history.map(r => {
                        const statusClass = r.status_type.replace(/\s+/g, '').toUpperCase();
                        return `
                        <tr onclick='showDetails(${JSON.stringify(r)})'>
                            <td><b>${r.resourceName}</b><br><small>${r.areaName}</small></td>
                            <td style="text-align:right">
                                ${formatShortDate(r.startTime)}<br>
                                <span class="status-tag ${statusClass}">${r.status_type}</span>
                            </td>
                        </tr>`}).join('');

                    renderPagination(data.currentPage, data.totalPages);
                } catch (error) { console.error(error); }
            }

            function goToReservation() {
                const errorDiv = document.getElementById('eligibilityError');
                if (isBlocked) {
                    errorDiv.textContent = "Unable to reserve. Your account is blocked until " + formatDateTime(blockedUntil);
                    setTimeout(() => { errorDiv.textContent = ""; }, 2500);
                    return;
                }
                if (!canReserve) {
                    errorDiv.textContent = "Unable to reserve. You have an ongoing reservation.";
                    setTimeout(() => { errorDiv.textContent = ""; }, 2500);
                    return;
                }
                window.location.href = "../reservationScreen/reservationScreen.html";
            }

            function renderPagination(current, total) {
                const container = document.getElementById('paginationContainer');
                container.innerHTML = '';
                if (total <= 1) return;
                for (let i = 1; i <= total; i++) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    btn.className = `page-btn ${i === current ? 'active' : ''}`;
                    btn.onclick = () => fetchDashboardData(i);
                    container.appendChild(btn);
                }
            }

            function showDetails(r) {
                document.getElementById('modalContent').innerHTML = `
                    <div class="modal-item"><b>Reservation ID</b><p>#${r.reservationID}</p></div>
                    <div class="modal-item"><b>Status</b><p>${r.status_type}</p></div>
                    <div class="modal-item"><b>Resource Name</b><p>${r.resourceName}</p></div>
                    <div class="modal-item"><b>Study Area</b><p>${r.areaName}</p></div>
                    <div class="modal-item"><b>Starts At</b><p>${formatDateTime(r.startTime)}</p></div>
                    <div class="modal-item"><b>Ends At</b><p>${formatDateTime(r.endTime)}</p></div>
                    <div class="modal-item" style="grid-column: span 2;">
                        <b>Purpose</b>
                        <div class="purpose-detail-box">
                            <p>${r.purpose || 'No purpose provided.'}</p>
                        </div>
                    </div>
                    <div class="modal-item"><b>Participants</b><p>${r.num_participants} person(s)</p></div>`;
                document.getElementById('modalOverlay').style.display = 'flex';
            }

            function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

            function filterHistory() {
                const value = document.getElementById('historySearch').value.toLowerCase();
                document.querySelectorAll('#historyBody tr').forEach(row => {
                    row.style.display = row.innerText.toLowerCase().includes(value) ? '' : 'none';
                });
            }

            document.addEventListener('DOMContentLoaded', () => fetchDashboardData(1));
        </script>
    </body>
    </html>
