<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildSTAR Login</title>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="LoginDesign.css">

    <!--Link to Archivo Black Font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>
<body style="background: url('../../images/backgroundGlobal.png') no-repeat center center/cover;">

    <div class="overlay">
        <div class="container">

            <!-- Logo -->
            <img src="../../images/wildStarLogo.png" alt="Wildcats Logo" class="logo">

            <!-- Title -->
            <h1>WildSTAR (Study Area Reservation)</h1>
            <h2>Enter User Details</h2>

            <!-- Form -->
            <form>
                <div class="input-group">
                    <input type="text" id="idNumber" placeholder="ID Number" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="buttons">
                    <button type="button" class="login" onclick="goLogin()">Login</button>
                    <button type="button" class="signup" onclick="goSignup()">Sign Up</button>
                </div>

                <div class="forgot">
                    <p>Forgot Password? <a href="../forgotPassScreen/ForgotPass.html">Click Here</a></p>
                </div>
            </form>

        </div>
    </div>

</body>
</html>

<script>
async function goLogin() {
    const idNumber = document.getElementById('idNumber').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!idNumber || !password) {
        alert('Please fill in all fields.');
        return;
    }

    try {
        const response = await fetch('../../php/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `idNumber=${encodeURIComponent(idNumber)}&password=${encodeURIComponent(password)}`
        });

        const result = await response.json();

        if (result.success) {
           if (result.role === 'Admin') {
                window.location.href = '../adminDashboardScreen/adminDashboardScreen.html';
            } else {
                window.location.href = '../userDashboardScreen/userDashboardScreen.html';
            }
        } else {
            alert(result.message);
        }

    } catch (error) {
        console.error('Login error:', error);
        alert('User not found. Please try again.');
    }
}

function goSignup() {
    window.location.href = "../registerScreen/Register.html";
}

</script>
